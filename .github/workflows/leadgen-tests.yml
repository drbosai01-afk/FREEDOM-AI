name: FREEDOM LEADS CI
on:
  pull_request:
    paths:
      - 'leadgen/**'
      - '.github/workflows/leadgen-tests.yml'
  push:
    branches: [main]
    paths:
      - 'leadgen/**'
      - '.github/workflows/leadgen-tests.yml'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install app and test dependencies
        working-directory: leadgen
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python code
        working-directory: leadgen
        run: python -m compileall -q main.py
      - name: Run API tests
        working-directory: leadgen
        run: python -m pytest -q
      - name: Check JavaScript syntax
        working-directory: leadgen
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          Path('app-syntax.js').write_text(html.split('<script>')[1].split('</script>')[0])
          PY
          node --check app-syntax.js
          node --check static/sw.js
