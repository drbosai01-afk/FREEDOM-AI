name: Audit public realtor catalog seed
on:
  push:
    branches: [feature/realty-cloud-auth]
    paths:
      - 'realty/tools/audit_live_catalog.py'
      - '.github/workflows/audit-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only catalog audit
        run: python realty/tools/audit_live_catalog.py
