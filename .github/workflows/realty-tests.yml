name: FREEDOM REALTY API tests
on:
  push:
    branches: [feature/realty-cloud-auth]
  pull_request:
    paths:
      - 'realty/cloud/**'
      - '.github/workflows/realty-tests.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realty/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        env:
          JWT_SECRET: test-only-ci-secret-change-me
        run: python -m pytest -q
