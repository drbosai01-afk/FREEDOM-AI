name: FREEDOM REALTY security and sync CI
on:
  push:
    branches: [feature/realty-cloud-auth]
    paths:
      - 'realty/cloud/**'
      - '.github/workflows/realty-tests.yml'
  pull_request:
    paths:
      - 'realty/cloud/**'
      - '.github/workflows/realty-tests.yml'
permissions:
  contents: read
concurrency:
  group: freedom-realty-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-and-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realty/cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned-range dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check JavaScript syntax
        run: |
          node --check cloud-sync-addon.js
          node --check cloud-offline.js
          node --check sw-cloud-extension.js
      - name: Lint Python syntax
        run: python -m compileall -q main.py migrations
      - name: Run synthetic API tests, migration and rate-limit tests
        env:
          JWT_SECRET: local-ci-only-key-never-use-for-production-0123456789
          ENVIRONMENT: test
        run: python -m pytest -q
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: freedom_ci
          POSTGRES_USER: freedom_ci
          POSTGRES_PASSWORD: test_only_not_real
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_ci -d freedom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: realty/cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL schema migration and head verification
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+psycopg://freedom_ci:test_only_not_real@127.0.0.1:5432/freedom_ci
          JWT_SECRET: ci-only-strong-key-0123456789-abcdefghijklmnopqrstuvwxyz
          PUBLIC_BASE_URL: https://localhost.example
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current
          python -c "from sqlalchemy import create_engine,inspect;import os; e=create_engine(os.environ['DATABASE_URL']); assert {'users','cloud_states','email_challenges','auth_attempts'}.issubset(inspect(e).get_table_names());print('PostgreSQL migration OK')"
      - name: Verify non-destructive catalog import on PostgreSQL 17
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+psycopg://freedom_ci:test_only_not_real@127.0.0.1:5432/freedom_ci
          JWT_SECRET: ci-only-strong-key-0123456789-abcdefghijklmnopqrstuvwxyz
          PUBLIC_BASE_URL: https://localhost.example
        run: python -m scripts.test_postgres_import
