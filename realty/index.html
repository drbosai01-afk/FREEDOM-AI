<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FREEDOM REALTY MVP</title><style>body{margin:0;background:#f3f6fa;color:#192943;font:16px system-ui}header{background:#13243e;color:#fff;padding:20px}main{max-width:850px;margin:auto;padding:15px}nav{display:flex;gap:7px;flex-wrap:wrap}button{background:#e6eefb;color:#184984;border:0;padding:12px;border-radius:10px;margin:3px;cursor:pointer}button.primary{background:#176bd1;color:#fff}.card{background:white;border:1px solid #dde4ed;border-radius:14px;padding:15px;margin:10px 0}input,textarea{display:block;width:100%;padding:10px;margin:7px 0;box-sizing:border-box;border:1px solid #aab8c9;border-radius:8px}label{display:block;margin-top:10px}a{color:#176bd1}</style><header><h2>⌂ FREEDOM REALTY</h2>Блокнот риелтора — MVP</header><main><nav><button onclick="tab('properties')">Объекты</button><button onclick="tab('clients')">Клиенты</button><button onclick="tab('shows')">Показы</button><button onclick="backup()">Скачать данные</button></nav><div id="app"></div></main><dialog id="dialog"><form id="form" method="dialog"></form></dialog><script>
const K='freedom-realty-data-v1',types={properties:[['title','Название'],['district','Район'],['rooms','Комнаты'],['area','Площадь'],['price','Цена'],['url','Ссылка']],clients:[['name','Имя'],['phone','Телефон'],['request','Запрос'],['budget','Бюджет']],shows:[['title','Клиент и объект'],['date','Дата'],['notes','Примечания']]};let db;try{db=JSON.parse(localStorage.getItem(K))||{}}catch{db={}}for(const t of Object.keys(types))if(!Array.isArray(db[t]))db[t]=[];let current='properties',query='';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
function persist(){localStorage.setItem(K,JSON.stringify(db));render()}
function tab(t){current=t;query='';render()}
function render(){const a=document.getElementById('app'),rows=db[current].filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));a.innerHTML='<h2>'+({properties:'Каталог объектов',clients:'Клиенты',shows:'Показы'}[current])+'</h2><button class="primary" id="new">+ Добавить</button><input id="search" placeholder="Поиск" value="'+safe(query)+'">'+(rows.map(x=>'<div class="card"><strong>'+safe(x.title||x.name)+'</strong><p>'+safe(x.district||x.request||x.notes||'')+'</p><p>'+safe(x.price||x.budget||x.date||'')+'</p>'+(url(x.url)?'<a href="'+safe(url(x.url))+'" target="_blank" rel="noopener noreferrer">Объявление ↗</a>':'')+'<div><button data-edit="'+safe(x.id)+'">Изменить</button><button data-del="'+safe(x.id)+'">Удалить</button></div></div>').join('')||'<p>Пока нет записей</p>');a.querySelector('#new').onclick=()=>form();a.querySelector('#search').oninput=e=>{query=e.target.value;render();let s=a.querySelector('#search');s.focus();s.setSelectionRange(query.length,query.length)};a.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(b.dataset.edit));a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить запись?')){db[current]=db[current].filter(x=>x.id!==b.dataset.del);persist()}})}
function form(id){const old=db[current].find(x=>x.id===id)||{},d=document.getElementById('dialog'),f=document.getElementById('form');f.innerHTML='<h2>'+(id?'Редактировать':'Добавить')+'</h2>'+types[current].map(([k,l])=>'<label>'+l+'<input name="'+k+'" value="'+safe(old[k])+'" '+(['title','name'].includes(k)?'required':'')+'></label>').join('')+'<button class="primary" type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button>';f.querySelector('#cancel').onclick=()=>d.close();f.onsubmit=e=>{e.preventDefault();let x={...old,id:id||String(Date.now())+'-'+Math.random().toString(36).slice(2)};new FormData(f).forEach((v,k)=>x[k]=String(v).trim());if(x.url&&!url(x.url)){alert('Ссылка должна начинаться с https://');return}if(id)db[current]=db[current].map(v=>v.id===id?x:v);else db[current].push(x);d.close();persist()};d.showModal()}
function backup(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='freedom-realty.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></html>
