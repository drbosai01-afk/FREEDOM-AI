<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оставить заявку</title><style>body{font:16px system-ui;background:#0a1327;color:#edf3ff;padding:15px}.card{max-width:520px;margin:6vh auto;background:#182845;padding:26px;border-radius:20px}input,textarea,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;margin:8px 0;font:inherit}input,textarea{background:#101d35;color:white;border:1px solid #3c547b}button{background:#667dff;border:0;color:white}label{display:block}#consent{width:auto}</style><div class="card"><h1>Оставьте заявку</h1><p>Специалист свяжется с вами.</p><form id="f"><input name="name" placeholder="Имя" required><input name="phone" placeholder="Телефон" required><input name="city" placeholder="Город"><input name="budget" placeholder="Бюджет"><textarea name="message" placeholder="Что ищете?"></textarea><input name="honeypot" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true"><label><input type="checkbox" id="consent" required> Согласие на обработку данных для обратной связи</label><p style="font-size:12px;color:#b8c5e0">Отправляя заявку, вы разрешаете связаться с вами по вашему запросу. Перед отправкой ознакомьтесь с <a id="privacy" style="color:#9dc4ff" href="#" target="_blank" rel="noopener noreferrer">политикой обработки персональных данных</a>.</p><button>Отправить</button></form><p id="info"></p></div><script>fetch('/api/public-config').then(r=>r.json()).then(d=>{const a=document.getElementById('privacy');if(d.privacy_policy_url?.startsWith('https://'))a.href=d.privacy_policy_url;else a.replaceWith(document.createTextNode('политикой владельца формы (пока не опубликована)'))}).catch(()=>{});document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));const query=new URLSearchParams(location.search);for(const key of ['utm_source','utm_medium','utm_campaign'])d[key]=(query.get(key)||'').slice(0,150);d.consent=document.getElementById('consent').checked;let r=await fetch('/api/public/'+location.pathname.split('/').pop(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.getElementById('info').textContent=r.ok?'Спасибо! Заявка принята.':'Ошибка отправки. Проверьте поля.';if(r.ok)e.target.reset()}</script>
