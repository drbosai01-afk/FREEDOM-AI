<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1223"><title>FREEDOM LEADS — автономное демо</title><style>*{box-sizing:border-box}body{margin:0;background:#090f1c;color:#eaf0ff;font:15px/1.45 system-ui}.shell{max-width:1300px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.logo{font-size:25px;font-weight:900}.logo span{color:#7e8eff}.layout{display:grid;grid-template-columns:205px 1fr;gap:19px}.nav{background:#131d32;border:1px solid #27364f;border-radius:17px;padding:10px;height:fit-content}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#a9bbd9;margin:5px 0;padding:12px;border-radius:9px;font:inherit;cursor:pointer}.nav button:hover,.nav .active{background:#2a3c65;color:white}.panel{background:#131e33;border:1px solid #2a3a54;border-radius:17px;padding:21px;margin-bottom:15px}.hero{background:linear-gradient(115deg,#172b56,#27365b)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:15px 0}.stat{background:#1b2b47;padding:18px;border-radius:12px}.stat strong{display:block;font-size:31px}.muted{color:#9cb0d0}.btn{border:0;border-radius:10px;padding:11px 16px;background:#6378ff;color:white;cursor:pointer;font:inherit;font-weight:650}.btn.alt{background:#253752}.btn.red{background:#7d3552}input,textarea,select{width:100%;border:1px solid #3b4b69;background:#0c1729;border-radius:10px;color:#fff;padding:12px;margin:5px 0 12px;font:inherit}textarea{min-height:75px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse;min-width:710px}td,th{border-bottom:1px solid #2c3950;text-align:left;padding:12px}.tablewrap{overflow:auto}.tag{background:#294067;border-radius:15px;padding:5px 9px;display:inline-block;font-size:12px}h1{font-size:26px;margin:0 0 10px}h2{font-size:20px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.auth{max-width:450px;margin:8vh auto}.hidden{display:none!important}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.column{background:#10192b;border-radius:13px;padding:12px}.leadcard{padding:12px;background:#213352;margin:8px 0;border-radius:10px;cursor:pointer}.bar{height:12px;background:#273653;border-radius:12px;overflow:hidden;margin:7px 0 18px}.bar>div{height:100%;background:#6178ff}.mini{color:#a3b3cf;font-size:12px}.success{color:#78e0bd}.link{word-break:break-all;color:#a8bcff}label{font-size:13px;font-weight:600}.toast{position:fixed;bottom:18px;right:18px;background:#384c78;padding:16px;border-radius:11px;max-width:90vw}.foot{color:#788bab;font-size:12px;margin:20px 0}@media(max-width:820px){.layout{display:block}.nav{display:flex;overflow-x:auto;margin-bottom:14px}.nav button{white-space:nowrap;width:auto}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid2,.kanban,.metrics{grid-template-columns:1fr}.shell{padding:11px}.panel{padding:15px}.logo{font-size:19px}}
</style></head><body><section id="auth" class="auth panel"><div class="logo">✦ FREEDOM <span>LEADS</span></div><h1 style="margin-top:20px">Управляйте потоком клиентов</h1><p class="muted">Автономный предпросмотр без сервера. Не вводите реальные персональные данные.</p><input id="email" type="hidden" value="demo@freedom.local"><input id="pass" type="hidden" value="demo-demo-123"><button class="btn" onclick="auth('login')">Открыть демо →</button></section><div id="app" class="shell hidden"><header class="head"><div class="logo">✦ FREEDOM <span>LEADS</span></div><div class="row"><span id="emailLabel" class="mini"></span><button class="btn alt" onclick="logout()">Выйти</button></div></header><div class="layout"><nav id="nav" class="nav"><button data-p="overview" class="active">◈ Обзор</button><button data-p="leads">◉ Заявки</button><button data-p="funnel">▥ Воронка</button><button data-p="sources">↗ Лид-формы</button><button data-p="tasks">✓ Задачи</button><button data-p="analytics">▤ Аналитика</button><button data-p="integrations">⚙ Интеграции</button></nav><main id="main"></main></div><div class="foot">FREEDOM LEADS · ОФЛАЙН-ДЕМО (без сервера) · Источники — только с согласия пользователей и через разрешённые API.</div></div><div id="toast" class="toast hidden"></div><script>
const $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let P='overview',L=[],S=[],T=[],A={};const stages={new:'Новые',working:'В работе',qualified:'Целевые',meeting:'На встрече',won:'Сделка',lost:'Отказ'};const m=(s)=>{let x=$('toast');x.textContent=s;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),4000)};
async function api(path,method='GET',data){
 let state=JSON.parse(localStorage.getItem('freedom_demo_state')||'{"leads":[],"sources":[],"tasks":[],"session":false}');
 const save=()=>localStorage.setItem('freedom_demo_state',JSON.stringify(state));
 if(path==='register'||path==='login'){state.session=true;save();return {email:'demo@freedom.local'}}
 if(path==='logout'){state.session=false;save();return {ok:true}}
 if(path==='me'){if(!state.session)throw Error('Демо не запущено');return {email:'demo@freedom.local',id:1}}
 if(!state.session)throw Error('Сначала откройте демо');
 if(path==='leads'&&method==='GET')return state.leads;
 if(path==='leads'&&method==='POST'){if(!data.phone&&!data.email)throw Error('Нужен контакт');let l={...data,id:Date.now(),status:'new',score:0,created:new Date().toISOString()};state.leads.unshift(l);save();return {lead:l,created:true}}
 if(path.startsWith('leads/')){let id=Number(path.split('/')[1]);if(method==='PATCH'){let l=state.leads.find(x=>x.id===id);if(l)l.status=data.status}else if(method==='DELETE')state.leads=state.leads.filter(x=>x.id!==id);save();return {ok:true}}
 if(path==='sources'&&method==='GET')return state.sources;
 if(path==='sources'&&method==='POST'){let slug=String(Date.now());let x={id:Date.now(),name:data.name,form:'Только в серверной версии: /f/'+slug,webhook:'Только в серверной версии: /api/webhook/'+slug,api_key_once:'Ключи API доступны после запуска сервера'};state.sources.push(x);save();return x}
 if(path==='tasks'&&method==='GET')return state.tasks;
 if(path==='tasks'&&method==='POST'){let x={...data,id:Date.now(),done:false};state.tasks.unshift(x);save();return x}
 if(path.startsWith('tasks/')&&method==='PATCH'){let t=state.tasks.find(x=>x.id===Number(path.split('/')[1]));if(t)t.done=data.done;save();return {ok:true}}
 if(path==='stats'){let statuses={},sources={};for(let l of state.leads){statuses[l.status]=(statuses[l.status]||0)+1;sources[l.source]=(sources[l.source]||0)+1}return {total:state.leads.length,statuses,sources,conversion:state.leads.length?Math.round((statuses.won||0)*1000/state.leads.length)/10:0}}
 throw Error('Эта функция требует сервер');}

async function auth(mode){try{await api(mode,'POST',{email:$('email').value.trim(),password:$('pass').value});$('pass').value='';await init()}catch(e){m(e.message)}}
async function init(){try{let me=await api('me');$('emailLabel').textContent=me.email;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
async function logout(){await api('logout','POST');await init()}
async function refresh(){[L,S,T,A]=await Promise.all(['leads','sources','tasks','stats'].map(x=>api(x)));draw()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));function go(p){P=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));draw()}
function meter(t,v,d){return `<div class="stat"><div class="muted">${t}</div><strong>${v}</strong><div class="mini">${d}</div></div>`}
function draw(){let html='';if(P==='overview')html=`<div class="panel hero"><div class="mini">ЕДИНАЯ ПЛАТФОРМА</div><h1>Лиды. Сделки. Рост.</h1><p>Принимайте заявки из форм и вебхуков, ведите клиентов по воронке и оценивайте эффективность рекламы.</p><div class="row"><button class="btn" onclick="go('leads')">Открыть заявки →</button><button class="btn alt" onclick="go('sources')">Создать форму</button></div></div><div class="metrics">${meter('Всего лидов',A.total||0,'в базе')}${meter('Новые',A.statuses?.new||0,'к обработке')}${meter('В работе',A.statuses?.working||0,'контакты')}${meter('Конверсия',A.conversion+'%','сделки / заявки')}</div><div class="panel"><h2>Недавние обращения</h2>${L.slice(0,6).map(l=>`<div class="leadcard" onclick="detail(${l.id})">${E(l.name||l.phone||l.email)} · <span class="muted">${E(l.source)}</span><div class="mini">${E(l.message).slice(0,110)}</div></div>`).join('')||'<p class="muted">Заявок пока нет. Создайте лид-форму или добавьте заявку вручную.</p>'}</div>`;
if(P==='leads')html=`<div class="panel"><div class="row spread"><div><h1>Заявки</h1><p class="muted">Поиск, редактирование статуса и экспорт.</p></div><div class="row"><button class="btn" onclick="newLead()">+ Добавить</button><button class="btn alt" onclick="exportDemo()">↓ CSV</button></div></div><div class="grid2"><input id="search" oninput="list()" placeholder="Найти клиента"><select id="statusfilter" onchange="list()"><option value="">Любой этап</option>${Object.entries(stages).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div id="list"></div></div>`;
if(P==='funnel')html=`<h1>Воронка продаж</h1><p class="muted">Откройте лид, чтобы поменять этап.</p><div class="kanban">${Object.entries(stages).map(([k,v])=>`<div class="column"><h3>${v} · ${L.filter(l=>l.status===k).length}</h3>${L.filter(l=>l.status===k).map(l=>`<div class="leadcard" onclick="detail(${l.id})">${E(l.name||l.phone||l.email)}<div class="mini">${E(l.source)}</div></div>`).join('')}</div>`).join('')}</div>`;
if(P==='sources')html=`<div class="panel"><h1>Лид-формы и источники</h1><p class="muted">Создайте уникальную форму и ключ API для автоматической передачи обращений.</p><div class="row"><input style="max-width:430px" id="sourceName" placeholder="Например: ВК Недвижимость Краснодар"><button class="btn" onclick="createSource()">+ Создать</button></div></div>${S.map(s=>`<div class="panel"><h3>${E(s.name)}</h3><p class="mini">Публичная форма</p><a class="link" href="${E(s.form)}" target="_blank">${E(s.form)}</a><p class="mini">Webhook (POST JSON, заголовок X-API-Key)</p><div class="link">${E(s.webhook)}</div></div>`).join('')||'<div class="panel muted">Источников нет.</div>'}`;
if(P==='tasks')html=`<div class="panel"><h1>Задачи</h1><div class="grid2"><input id="taskTitle" placeholder="Позвонить покупателю"><input type="datetime-local" id="taskDue"></div><button class="btn" onclick="createTask()">+ Создать</button></div><div class="panel">${T.map(t=>`<div class="leadcard row"><input type="checkbox" style="width:20px" onchange="finishTask(${t.id},this.checked)" ${t.done?'checked':''}><div style="flex:1;${t.done?'text-decoration:line-through':''}">${E(t.title)}<div class="mini">${E(t.due)}</div></div></div>`).join('')||'<div class="muted">Задач пока нет.</div>'}</div>`;
if(P==='analytics')html=`<h1>Аналитика</h1><div class="metrics">${meter('Обращения',A.total||0,'всего')}${meter('Успешные сделки',A.statuses?.won||0,'закрыты')}${meter('Конверсия',A.conversion+'%','доля сделок')}${meter('Каналы',Object.keys(A.sources||{}).length,'источников')}</div><div class="panel"><h2>Источники</h2>${Object.entries(A.sources||{}).map(([k,v])=>`<div><b>${E(k)}</b> · ${v}<div class="bar"><div style="width:${v/Math.max(1,A.total)*100}%"></div></div></div>`).join('')||'<p class="muted">Данные появятся после первых заявок.</p>'}</div><div class="panel"><h2>Воронка</h2>${Object.entries(stages).map(([k,n])=>`<div><b>${n}</b> · ${A.statuses?.[k]||0}<div class="bar"><div style="width:${(A.statuses?.[k]||0)/Math.max(1,A.total)*100}%"></div></div></div>`).join('')}</div>`;
if(P==='integrations')html=`<div class="panel"><h1>Интеграции</h1><p>Ссылки на формы можно размещать в ВКонтакте, Telegram и Яндекс Директе с UTM-метками. Для серверных интеграций используйте webhook с одноразовым ключом.</p><div class="grid2"><div class="stat"><h3>ВКонтакте</h3><p>Рекламная ссылка на публичную форму.</p></div><div class="stat"><h3>Telegram</h3><p>Входящие через форму или защищённый webhook бота.</p></div><div class="stat"><h3>Яндекс</h3><p>UTM-ссылка на форму в кампании.</p></div><div class="stat"><h3>CRM / API</h3><p>POST JSON с ключом X-API-Key.</p></div></div><p><a class="link" href="/docs">API / OpenAPI документация →</a></p></div>`;
$('main').innerHTML=html;if(P==='leads')list()}
function list(){let box=$('list');if(!box)return;let q=($('search')?.value||'').toLowerCase(),st=$('statusfilter')?.value;let a=L.filter(l=>(!st||l.status===st)&&(!q||[l.name,l.phone,l.email,l.message].some(x=>String(x||'').toLowerCase().includes(q))));box.innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>Клиент</th><th>Запрос</th><th>Источник</th><th>Статус</th><th></th></tr></thead><tbody>${a.map(l=>`<tr><td>${E(l.name||'—')}<div class="mini">${E(l.phone||l.email)}</div></td><td>${E(l.message).slice(0,80)}</td><td>${E(l.source)}</td><td><span class="tag">${stages[l.status]}</span></td><td><button class="btn alt" onclick="detail(${l.id})">Открыть</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">По заданному фильтру обращений нет.</p>'}
function formFields(){return `<div class="grid2"><label>Имя<input id="n" placeholder="Имя"></label><label>Телефон<input id="ph" placeholder="+7 900 000-00-00"></label><label>Email<input id="em" type="email"></label><label>Город<input id="ct"></label><label>Бюджет<input id="bg"></label><label>Источник<input id="src" value="manual"></label></div><label>Запрос<textarea id="msg"></textarea></label>`}
function newLead(){$('main').innerHTML=`<div class="panel" style="max-width:670px"><h1>Новая заявка</h1>${formFields()}<div class="row"><button class="btn" onclick="saveLead()">Сохранить</button><button class="btn alt" onclick="go('leads')">Отмена</button></div></div>`}
async function saveLead(){try{await api('leads','POST',{name:$('n').value,phone:$('ph').value,email:$('em').value,city:$('ct').value,budget:$('bg').value,source:$('src').value||'manual',message:$('msg').value});await refresh();go('leads');m('Заявка сохранена')}catch(e){m(e.message)}}
function detail(id){let l=L.find(v=>v.id===id);if(!l)return;$('main').innerHTML=`<div class="panel" style="max-width:700px"><div class="mini">ЗАЯВКА #${l.id} · ${E(l.source)}</div><h1>${E(l.name||l.phone||l.email)}</h1><p>${E(l.message||'Без описания')}</p><div class="grid2"><div><div class="muted">Телефон</div><b>${E(l.phone||'—')}</b></div><div><div class="muted">Email</div><b>${E(l.email||'—')}</b></div><div><div class="muted">Город</div><b>${E(l.city||'—')}</b></div><div><div class="muted">Бюджет</div><b>${E(l.budget||'—')}</b></div></div><label>Статус<select id="newStatus">${Object.entries(stages).map(([k,v])=>`<option value="${k}" ${l.status===k?'selected':''}>${v}</option>`).join('')}</select></label><div class="row"><button class="btn" onclick="changeStatus(${id})">Сохранить статус</button><button class="btn alt" onclick="go('leads')">Назад</button><button class="btn red" onclick="remove(${id})">Удалить</button></div></div>`}
async function changeStatus(id){try{await api('leads/'+id,'PATCH',{status:$('newStatus').value});await refresh();detail(id);m('Статус изменён')}catch(e){m(e.message)}}
async function remove(id){if(!confirm('Удалить заявку?'))return;try{await api('leads/'+id,'DELETE');await refresh();go('leads')}catch(e){m(e.message)}}
async function createSource(){try{let s=await api('sources','POST',{name:$('sourceName').value});await refresh();go('sources');$('main').insertAdjacentHTML('afterbegin',`<div class="panel"><h3 class="success">Источник создан</h3><p>Секретный ключ webhook показывается только один раз. Скопируйте и сохраните:</p><textarea readonly>${E(s.api_key_once)}</textarea></div>`)}catch(e){m(e.message)}}
async function createTask(){try{await api('tasks','POST',{title:$('taskTitle').value,due:$('taskDue').value});await refresh();go('tasks')}catch(e){m(e.message)}}
async function finishTask(id,done){try{await api('tasks/'+id,'PATCH',{done});await refresh();go('tasks')}catch(e){m(e.message)}}
function exportDemo(){let keys=['name','phone','email','city','budget','source','status','message'];let escCsv=x=>'"'+String(x??'').replaceAll('"','""')+'"';let csv='\ufeff'+keys.join(',')+'\n'+L.map(l=>keys.map(k=>escCsv(l[k])).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='freedom-demo.csv';a.click();URL.revokeObjectURL(a.href)}
init();</script></body></html>
