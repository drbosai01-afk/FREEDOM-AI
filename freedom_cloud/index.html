<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1220"><title>FREEDOM</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#eaf1ff;font:16px system-ui,-apple-system,Arial}.wrap{max-width:780px;padding:26px 16px;margin:auto}header{font-size:30px;letter-spacing:.5px;font-weight:800}small{display:block;margin:8px 0 26px;color:#a3b6ce}.panel{background:#19263b;border:1px solid #344961;padding:16px;border-radius:14px;margin:15px 0}textarea,input{background:#162235;border:1px solid #486181;border-radius:12px;color:white;padding:13px;font:16px system-ui;width:100%}textarea{height:135px;resize:vertical}button{border:none;padding:13px 22px;background:#77aaff;border-radius:12px;font-size:17px;font-weight:650;color:#101b29;margin-top:14px}button:disabled{opacity:.6}.response{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#b3c9e8;padding:13px 0}.label{font-size:13px;color:#9fb3d0;display:block;margin:0 0 7px}</style></head><body><div class="wrap"><header>FREEDOM</header><small>Облачная версия · Groq API · без Termux и Codespaces</small><div class="panel"><label class="label" for="password">Пароль доступа к FREEDOM</label><input id="password" type="password" autocomplete="off" placeholder="Пароль, заданный в Vercel" /><p class="label">Пароль не сохраняется в браузере и используется только для текущего запроса.</p><label class="label" for="prompt">Задача</label><textarea id="prompt" placeholder="Что нужно сделать?"></textarea><button id="send">Отправить</button><div id="status">Сайт загружен. Проверка ИИ доступна после настройки защищённых переменных.</div></div><div id="answer" class="panel response" hidden></div></div><script>document.querySelector('#send').onclick=async()=>{const prompt=document.querySelector('#prompt').value.trim(),password=document.querySelector('#password').value;if(!prompt)return;const btn=document.querySelector('#send'),stat=document.querySelector('#status'),answer=document.querySelector('#answer');btn.disabled=true;stat.textContent='Обработка запроса...';answer.hidden=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Freedom-Access':password},body:JSON.stringify({prompt})});const out=await r.json();answer.textContent=out.answer||out.error||'Пустой ответ';answer.hidden=false;stat.textContent=r.ok?'Запрос выполнен':'Ошибка '+r.status;}catch(e){stat.textContent='Сбой сети: '+String(e)}finally{btn.disabled=false}};</script></body></html>
